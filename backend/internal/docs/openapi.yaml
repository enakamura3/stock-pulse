openapi: 3.0.3
info:
  title: stock-pulse API
  description: API REST para a plataforma stock-pulse - Sistema modular para monitoramento de ações, favoritos (watchlists), portfólios financeiros multi-moeda, renda fixa, tesouro direto, alertas de preço e cotações em tempo real via WebSocket.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de Desenvolvimento Local
paths:
  /healthz:
    get:
      summary: Health Check da API
      description: Verifica se a API está operacional e com conexão ativa ao banco de dados PostgreSQL.
      tags:
        - Sistema
      responses:
        '200':
          description: API e banco de dados saudáveis
          content:
            text/plain:
              schema:
                type: string
                example: "OK - Database Connected"
        '503':
          description: Banco de dados inacessível

  /metrics:
    get:
      summary: Métricas Prometheus
      description: Expõe métricas de latência HTTP, contagem de requisições, status e telemetria interna para coleta do Prometheus.
      tags:
        - Sistema
      responses:
        '200':
          description: Métricas operacionais em formato Prometheus
          content:
            text/plain:
              schema:
                type: string

  /auth/register:
    post:
      summary: Registrar um novo usuário
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: investidor@gmail.com
                password:
                  type: string
                  format: password
                  example: SenhaSegura123
                name:
                  type: string
                  example: João Silva
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  name:
                    type: string
        '400':
          description: Erro de validação ou e-mail em uso

  /auth/login:
    post:
      summary: Autenticar usuário
      description: Valida e-mail e senha e retorna cookies HttpOnly seguros contendo o Access Token e o Refresh Token.
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: investidor@gmail.com
                password:
                  type: string
                  format: password
                  example: SenhaSegura123
      responses:
        '200':
          description: Login efetuado com sucesso (Cookies de sessão injetados)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      name:
                        type: string
        '401':
          description: Credenciais incorretas

  /auth/logout:
    post:
      summary: Encerrar sessão
      description: Destrói a sessão no Redis e expira os cookies do navegador.
      tags:
        - Autenticação
      responses:
        '200':
          description: Logout efetuado com sucesso

  /auth/refresh:
    post:
      summary: Renovar tokens silenciosamente
      description: Utiliza o cookie do Refresh Token para re-emitir um Access Token renovado no cabeçalho do cookie.
      tags:
        - Autenticação
      responses:
        '200':
          description: Sessão renovada com sucesso
        '401':
          description: Refresh Token inválido ou expirado

  /auth/me:
    get:
      summary: Obter dados do usuário ativo
      tags:
        - Autenticação
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dados do usuário retornados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  name:
                    type: string
        '401':
          description: Não autorizado

  /user/profile:
    put:
      summary: Atualizar nome e e-mail do usuário
      tags:
        - Usuário
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: João Silva Atualizado
                email:
                  type: string
                  format: email
                  example: joao.atualizado@gmail.com
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
        '400':
          description: Dados inválidos ou e-mail já em uso
        '401':
          description: Não autorizado

  /user/password:
    put:
      summary: Alterar senha do usuário
      tags:
        - Usuário
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: SenhaSegura123
                new_password:
                  type: string
                  format: password
                  example: NovaSenhaForte456
      responses:
        '200':
          description: Senha atualizada com sucesso
        '400':
          description: Senha atual incorreta ou nova senha inválida
        '401':
          description: Não autorizado

  /user:
    delete:
      summary: Excluir permanentemente conta e todos os dados associados (LGPD / Hard Delete)
      tags:
        - Usuário
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Conta e todos os dados financeiros excluídos permanentemente
        '401':
          description: Não autorizado

  /quotes/{ticker}:
    get:
      summary: Obter cotação atualizada de um ativo
      tags:
        - Dados de Mercado
      security:
        - cookieAuth: []
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            example: PETR4.SA
      responses:
        '200':
          description: Cotação retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: number
                  change:
                    type: number
                  change_percent:
                    type: number
                  currency:
                    type: string
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: Ticker não encontrado

  /assets/search:
    get:
      summary: Pesquisa autocomplete de ativos globais
      tags:
        - Dados de Mercado
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            example: VALE3
      responses:
        '200':
          description: Resultados da busca textual
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                    name:
                      type: string
                    type:
                      type: string

  /assets/{ticker}:
    get:
      summary: Obter metadados cadastrados do ativo (categoria, moeda, nome)
      tags:
        - Dados de Mercado
      security:
        - cookieAuth: []
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            example: PETR4.SA
      responses:
        '200':
          description: Metadados do ativo cadastrado
        '404':
          description: Ativo não encontrado

  /market/benchmarks:
    get:
      summary: Obter benchmarks e índices de mercado em tempo real
      tags:
        - Dados de Mercado
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Benchmarks retornados com sucesso (IBOV, S&P 500, Dólar, IFIX)

  /market/quotes/invalidate:
    post:
      summary: Invalidar chaves de cache de cotações no Redis
      tags:
        - Dados de Mercado
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                symbols:
                  type: array
                  items:
                    type: string
                  description: Lista opcional de tickers para invalidar. Se omitido, invalida todos os caches de cotação.
      responses:
        '200':
          description: Cache de cotações invalidado com sucesso

  /watchlists:
    get:
      summary: Listar watchlists do usuário
      tags:
        - Watchlists
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Listagem retornada (Cria a padrão "Favoritos" automaticamente no onboarding)
    post:
      summary: Criar nova watchlist
      tags:
        - Watchlists
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Tecnologia
      responses:
        '201':
          description: Watchlist criada com sucesso

  /watchlists/{id}:
    get:
      summary: Detalhes de uma watchlist com cotações integradas
      tags:
        - Watchlists
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Watchlist detalhada
    delete:
      summary: Excluir uma watchlist
      tags:
        - Watchlists
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Watchlist apagada

  /watchlists/{id}/items:
    post:
      summary: Favoritar ativo em uma watchlist
      tags:
        - Watchlists
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticker
              properties:
                ticker:
                  type: string
                  example: AAPL
      responses:
        '201':
          description: Ativo favoritado com sucesso (Auto-importa se inédito)

  /watchlists/{id}/items/{ticker}:
    delete:
      summary: Remover ativo favorito de uma watchlist
      tags:
        - Watchlists
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            example: AAPL
      responses:
        '200':
          description: Ativo removido

  /portfolios:
    get:
      summary: Listar portfólios do usuário
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Listagem com consolidado financeiro
    post:
      summary: Criar novo portfólio
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - base_currency
              properties:
                name:
                  type: string
                  example: Aposentadoria
                base_currency:
                  type: string
                  example: BRL
      responses:
        '201':
          description: Portfólio criado

  /portfolios/{id}:
    get:
      summary: Detalhes analíticos consolidados do portfólio (Rentabilidade, Preço Médio)
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do portfólio
    delete:
      summary: Excluir portfólio
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Portfólio apagado

  /portfolios/{id}/default:
    put:
      summary: Definir carteira como padrão do usuário ao fazer login
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carteira definida como padrão

  /portfolios/{id}/transactions:
    get:
      summary: Listar transações do portfólio
      tags:
        - Transações
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Histórico de transações
    post:
      summary: Registrar nova transação de compra/venda
      tags:
        - Transações
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticker
                - type
                - quantity
                - unit_price
                - executed_at
              properties:
                ticker:
                  type: string
                  example: VALE3.SA
                asset_type:
                  type: string
                  enum: [STOCK_BR, FII, FIAGRO, ETF_BR, BDR, STOCK_US, ETF_US, CRYPTO]
                  example: STOCK_BR
                type:
                  type: string
                  enum: [BUY, SELL, SPLIT, REVERSE_SPLIT, BONUS]
                  example: BUY
                quantity:
                  type: number
                  example: 50
                unit_price:
                  type: number
                  example: 83.10
                exchange_rate:
                  type: number
                  example: 1.0000
                executed_at:
                  type: string
                  format: date
                  example: "2026-05-20"
      responses:
        '201':
          description: Transação registrada (E auto-importa histórico de 5 anos se ticker for inédito)

  /portfolios/{id}/transactions/bulk:
    post:
      summary: Importar Transações em Lote (CSV)
      tags:
        - Transações
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Transações importadas com sucesso

  /portfolios/{id}/transactions/{txId}:
    put:
      summary: Atualizar uma transação existente
      tags:
        - Transações
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: txId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: number
                unit_price:
                  type: number
                exchange_rate:
                  type: number
                executed_at:
                  type: string
                  format: date
      responses:
        '200':
          description: Transação atualizada
    delete:
      summary: Remover transação do portfólio
      tags:
        - Transações
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: txId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transação removida e carteira recalculada

  /portfolios/{id}/performance:
    get:
      summary: Evolução Patrimonial Diária do Portfólio (LOCF)
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1M, 3M, 6M, 1Y, ALL]
            example: ALL
      responses:
        '200':
          description: Série histórica de evolução de saldo e rentabilidade comparativa para gráficos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      example: "2026-07-07"
                    value:
                      type: number
                      example: 10500.42
                    total_invested:
                      type: number
                      example: 10000.00
                    return_pct:
                      type: number
                      example: 5.00
                    cdi_return_pct:
                      type: number
                      example: 3.42
                    ipca_return_pct:
                      type: number
                      example: 1.25
                    ifix_return_pct:
                      type: number
                      example: 2.10
                    ibov_return_pct:
                      type: number
                      example: 4.56
                    sp500_return_pct:
                      type: number
                      example: 6.80

  /portfolios/{id}/dividends:
    get:
      summary: Consultar histórico consolidado de proventos (dividendos, JCP, rendimentos)
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: false
          schema:
            type: string
            example: "2026"
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "05"
        - name: ticker
          in: query
          required: false
          schema:
            type: string
            example: "PETR4.SA"
      responses:
        '200':
          description: Lista de proventos calculados para a carteira
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    asset_id:
                      type: string
                      format: uuid
                    ticker:
                      type: string
                    type:
                      type: string
                    cum_date:
                      type: string
                      format: date
                    payment_date:
                      type: string
                      format: date
                    gross_amount:
                      type: number
                    net_amount:
                      type: number
                    rate:
                      type: number
                    currency:
                      type: string
                    quantity:
                      type: number

  /portfolios/{id}/export:
    get:
      summary: Exportar histórico de transações da carteira em formato CSV
      tags:
        - Portfólios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arquivo CSV para download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /portfolios/{portfolioID}/history:
    get:
      summary: Histórico unificado de movimentações (ações, FIIs, BDRs, renda fixa e tesouro)
      tags:
        - Histórico
      security:
        - cookieAuth: []
      parameters:
        - name: portfolioID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista ordenada de movimentações unificadas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    portfolio_id:
                      type: string
                      format: uuid
                    category:
                      type: string
                      enum: [EQUITY, FIXED_INCOME, TREASURY]
                    ticker_or_name:
                      type: string
                    type:
                      type: string
                    quantity:
                      type: number
                    unit_price:
                      type: number
                    total_amount:
                      type: number
                    executed_at:
                      type: string
                      format: date

  /portfolios/{portfolioID}/fixed-income/positions:
    get:
      summary: Listar posições ativas de renda fixa privada (CDB, LCI, LCA, Debêntures)
      tags:
        - Renda Fixa
      security:
        - cookieAuth: []
      parameters:
        - name: portfolioID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Posições consolidadas com saldo bruto e líquido projetado

  /portfolios/{portfolioID}/fixed-income/performance:
    get:
      summary: Resumo de rentabilidade e métricas consolidadas de renda fixa
      tags:
        - Renda Fixa
      security:
        - cookieAuth: []
      parameters:
        - name: portfolioID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Métricas de saldo investido, saldo bruto, saldo líquido e rendimento total

  /portfolios/{portfolioID}/fixed-income/monthly-yields:
    get:
      summary: Rendimentos mensais projetados e passados de renda fixa
      tags:
        - Renda Fixa
      security:
        - cookieAuth: []
      parameters:
        - name: portfolioID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Série temporal de rendimentos mês a mês

  /portfolios/{portfolioID}/fixed-income/assets:
    post:
      summary: Cadastrar novo ativo de renda fixa privada
      tags:
        - Renda Fixa
      security:
        - cookieAuth: []
      parameters:
        - name: portfolioID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - issuer
                - instrument_type
                - indexer
                - rate
                - maturity_date
              properties:
                name:
                  type: string
                  example: "CDB Banco Inter 110% CDI"
                issuer:
                  type: string
                  example: "Banco Inter"
                instrument_type:
                  type: string
                  enum: [CDB, LCI, LCA, LC, DEBENTURE, CRI, CRA]
                indexer:
                  type: string
                  enum: [CDI, IPCA, PRE, SELIC, IGPM]
                rate:
                  type: number
                  example: 110.0
                maturity_date:
                  type: string
                  format: date
                  example: "2028-05-15"
                initial_investment:
                  type: number
                  example: 5000.00
                application_date:
                  type: string
                  format: date
                  example: "2026-05-15"
      responses:
        '201':
          description: Ativo de renda fixa cadastrado com sucesso

  /portfolios/{portfolioID}/fixed-income/assets/{assetID}:
    delete:
      summary: Excluir ativo de renda fixa e todas as suas movimentações
      tags:
        - Renda Fixa
      security:
        - cookieAuth: []
      parameters:
        - name: portfolioID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assetID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ativo excluído com sucesso

  /portfolios/{portfolioID}/fixed-income/assets/{assetID}/transactions:
    post:
      summary: Registrar movimentação (aplicação ou resgate) em ativo de renda fixa
      tags:
        - Renda Fixa
      security:
        - cookieAuth: []
      parameters:
        - name: portfolioID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assetID
          in: path
          required: true
          schema:
            type: string
