              schema:
                type: string
                format: binary

  /ws:
    get:
      summary: Conexão WebSocket para cotações em tempo real
      description: |
        Estabelece conexão WebSocket bidirecional para streaming contínuo de cotações de ações, FIIs e criptos.
        Mensagens JSON suportadas:
        - `{"action": "subscribe", "ticker": "PETR4.SA"}`
        - `{"action": "unsubscribe", "ticker": "PETR4.SA"}`
      tags:
        - WebSocket
      security:
        - cookieAuth: []
      responses:
        '101':
          description: Mudança de protocolo para WebSocket (Conexão estabelecida)
        '401':
          description: Não autorizado (Sessão ausente ou inválida)

  /alerts:
    get:
      summary: Listar alertas de preço do usuário
      tags:
        - Alertas
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Listagem de alertas ativos, disparados e pausados
    post:
      summary: Criar alerta de preço personalizado
      tags:
        - Alertas
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticker
                - target_price
                - condition
              properties:
                ticker:
                  type: string
                  example: PETR4.SA
                target_price:
                  type: number
                  example: 38.50
                condition:
                  type: string
                  enum: [ABOVE, BELOW]
                  example: ABOVE
      responses:
        '201':
          description: Alerta ativado com sucesso (E auto-onboarda ativo se inédito)

  /alerts/{id}:
    delete:
      summary: Excluir alerta de preço
      tags:
        - Alertas
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Alerta deletado

  /alerts/{id}/toggle:
    put:
      summary: Pausar ou reativar alerta
      tags:
        - Alertas
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status alternado com sucesso

  /telegram/status:
    get:
      summary: Verificar status de vinculação com o bot do Telegram
      tags:
        - Telegram
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Informações de status da vinculação
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked:
                    type: boolean
                    example: true
                  chat_id:
                    type: integer
                    example: 123456789
                  bot_username:
                    type: string
                    example: "StockPulseBot"

  /telegram/link:
    post:
      summary: Gerar token temporário de vinculação com o Telegram
      tags:
        - Telegram
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token de 6 dígitos gerado com expiração de 10 minutos
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "948210"
                  bot_username:
                    type: string
                    example: "StockPulseBot"
    delete:
      summary: Desvincular conta do Telegram
      tags:
        - Telegram
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Conta desvinculada com sucesso

  /workers:
    get:
      summary: Listar todos os workers (tarefas em segundo plano)
      tags:
        - Administração
      security:
        - adminKeyAuth: []
      responses:
        '200':
          description: Listagem de workers com status e horários
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    last_run:
                      type: string
                      format: date-time
                    next_run:
                      type: string
                      format: date-time
                    status:
                      type: string
                    interval:
                      type: string

  /workers/{name}/trigger:
    post:
      summary: Executar um worker manualmente
      tags:
        - Administração
      security:
        - adminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: DividendWorker
      responses:
        '200':
          description: Worker disparado com sucesso
        '404':
          description: Worker não encontrado

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    adminKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Key
